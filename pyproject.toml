[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reft-labeling-automation"
version = "0.1.0"
description = "Локальная агентская предразметка кадров в YOLO Segmentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "Jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "real_codex: ручной smoke-тест с реальным Codex CLI (по умолчанию пропускается)",
]

[tool.setuptools.packages.find]
include = ["app*"]

